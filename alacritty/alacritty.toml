[general]
    import = ["~/.config/alacritty/themes/catppuccin_mocha.toml"]
[env]
	TERM = "xterm-256color"
[font]
    [font.normal]
    family = "JetBrainsMono Nerd Font"
    style = "Regular"
    [font.bold]
    family = "JetBrainsMono Nerd Font"
    style = "Bold"
    [font.italic]
    family = "JetBrainsMono Nerd Font"
    style = "Italic"
    [font.bold_italic]
    family = "JetBrainsMono Nerd Font"
    style = "Bold Italic"
